    function log(msg, type = 'info') {
        const el = document.getElementById('log');
        const time = new Date().toLocaleTimeString();
        el.innerHTML += `<span class="${type}">[${time}] ${msg}</span>\n`;
        el.scrollTop = el.scrollHeight;
    }

    function convertDate(ddmmyyyy) {
        const parts = ddmmyyyy.split('/');
        return `${parts[2]}-${parts[1].padStart(2,'0')}-${parts[0].padStart(2,'0')}`;
    }

    function mapRecord(r) {
        const tipoMap = { 'Gasto': 'gasto', 'Ingreso': 'ingreso', 'Consignación': 'consignación' };
        return {
            date: convertDate(r.fecha),
            type: tipoMap[r.tipo] || r.tipo.toLowerCase(),
            concept: r.concepto || null,
            receiver: r.detalle || null,
            subcategory: r.concepto || null,
            amount: r.monto,
            payment_method: r.metodo || null,
            description: r.detalle || null,
        };
    }

    async function verificarDatos() {
        log('Consultando registros existentes en Supabase...', 'info');
        try {
            const res = await fetch(
                `${SUPABASE_URL}/rest/v1/transactions?select=date,type,amount,description&order=date.desc&limit=10`,
                { headers: supabaseHeaders }
            );
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const data = await res.json();
            log(`✅ Conexión exitosa. Últimos registros en BD:`, 'success');
            data.forEach(t => {
                log(`   ${t.date} | ${t.type} | $${Number(t.amount).toLocaleString()} | ${(t.description||'').substring(0,40)}`, 'info');
            });

            // Count total
            const countRes = await fetch(
                `${SUPABASE_URL}/rest/v1/transactions?select=id`,
                { headers: { ...supabaseHeaders, 'Prefer': 'count=exact', 'Range-Unit': 'items', 'Range': '0-0' } }
            );
            const countHeader = countRes.headers.get('content-range');
            log(`📊 Total registros en BD: ${countHeader}`, 'warn');

            // Check latest date
            if (data.length > 0) {
                log(`📅 Fecha más reciente en BD: ${data[0].date}`, 'warn');
            }

            document.getElementById('summary').innerHTML = `
                <strong>Estado:</strong> BD conectada | Último registro: ${data[0]?.date || 'N/A'} | 
                CSV tiene ${csvData.length} registros para cargar (desde ${convertDate(csvData[csvData.length-1].fecha)} hasta ${convertDate(csvData[0].fecha)})
            `;
        } catch(e) {
            log(`❌ Error: ${e.message}`, 'error');
        }
    }

    async function previsualizarCargue() {
        log('=== PREVISUALIZACIÓN DEL CARGUE ===', 'warn');
        log(`Total registros en CSV: ${csvData.length}`, 'info');

        // Check for potential duplicates
        log('Verificando posibles duplicados con la BD...', 'info');
        try {
            const res = await fetch(
                `${SUPABASE_URL}/rest/v1/transactions?select=date,amount,description&date=gte.2026-02-28`,
                { headers: supabaseHeaders }
            );
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const existing = await res.json();
            log(`Registros existentes desde 2026-02-28: ${existing.length}`, 'info');

            // Build a key set for existing records
            const existingKeys = new Set(existing.map(t => `${t.date}|${t.amount}|${t.description}`));

            let duplicates = 0;
            let newRecords = 0;
            const mappedRecords = csvData.map(mapRecord);

            mappedRecords.forEach(r => {
                const key = `${r.date}|${r.amount}|${r.description}`;
                if (existingKeys.has(key)) {
                    duplicates++;
                } else {
                    newRecords++;
                }
            });

            log(`🔄 Posibles duplicados detectados: ${duplicates}`, duplicates > 0 ? 'warn' : 'success');
            log(`🆕 Registros nuevos a insertar: ${newRecords}`, 'success');

            // Show sample of mapped records
            log('\n--- Muestra de registros mapeados (primeros 5) ---', 'info');
            mappedRecords.slice(0, 5).forEach((r, i) => {
                log(`  [${i+1}] ${r.date} | ${r.type} | ${r.payment_method || 'N/A'} | $${r.amount.toLocaleString()} | ${(r.description||'').substring(0,35)}`, 'info');
            });

            document.getElementById('summary').innerHTML = `
                <strong>Preview:</strong> ${csvData.length} registros totales | 
                ${newRecords} nuevos | ${duplicates} posibles duplicados | 
                <span style="color:#fbbf24">⚠️ El cargue insertará SOLO los ${newRecords} registros nuevos</span>
            `;
        } catch(e) {
            log(`❌ Error: ${e.message}`, 'error');
        }
    }

    async function ejecutarCargue() {
        if (!confirm('¿Confirmas que deseas insertar los registros nuevos en Supabase?')) return;

        log('=== INICIANDO CARGUE MASIVO ===', 'warn');

        // Get existing records to avoid duplicates
        let existingKeys = new Set();
        try {
            const res = await fetch(
                `${SUPABASE_URL}/rest/v1/transactions?select=date,amount,description&date=gte.2026-02-28`,
                { headers: supabaseHeaders }
            );
            if (res.ok) {
                const existing = await res.json();
                existingKeys = new Set(existing.map(t => `${t.date}|${t.amount}|${t.description}`));
                log(`Cargados ${existing.length} registros existentes para comparación`, 'info');
            }
        } catch(e) {
            log(`⚠️ No se pudieron verificar duplicados: ${e.message}`, 'warn');
        }

        const mappedRecords = csvData.map(mapRecord);
        const toInsert = mappedRecords.filter(r => {
            const key = `${r.date}|${r.amount}|${r.description}`;
            return !existingKeys.has(key);
        });

        log(`Registros a insertar: ${toInsert.length} (${mappedRecords.length - toInsert.length} duplicados omitidos)`, 'info');

        if (toInsert.length === 0) {
            log('✅ No hay registros nuevos para insertar. La BD ya está actualizada.', 'success');
            document.getElementById('summary').innerHTML = '<strong style="color:#00ff66">✅ BD ya actualizada, no hay registros nuevos.</strong>';
            return;
        }

        // Insert in batches of 20
        const batchSize = 20;
        let inserted = 0;
        let errors = 0;

        for (let i = 0; i < toInsert.length; i += batchSize) {
            const batch = toInsert.slice(i, i + batchSize);
            try {
                const res = await fetch(`${SUPABASE_URL}/rest/v1/transactions`, {
                    method: 'POST',
                    headers: supabaseHeaders,
                    body: JSON.stringify(batch)
                });
                if (!res.ok) {
                    const errBody = await res.text();
                    throw new Error(`HTTP ${res.status}: ${errBody}`);
                }
                inserted += batch.length;
                log(`✅ Batch ${Math.floor(i/batchSize)+1}: ${batch.length} registros insertados (total: ${inserted}/${toInsert.length})`, 'success');
            } catch(e) {
                errors += batch.length;
                log(`❌ Error en batch ${Math.floor(i/batchSize)+1}: ${e.message}`, 'error');
            }
            // Small delay between batches
            await new Promise(resolve => setTimeout(resolve, 300));
        }

        log(`\n=== CARGUE COMPLETADO ===`, 'warn');
        log(`✅ Insertados: ${inserted}`, 'success');
        if (errors > 0) log(`❌ Errores: ${errors}`, 'error');

        document.getElementById('summary').innerHTML = `
            <strong style="color:#00ff66">✅ Cargue completado:</strong> ${inserted} registros insertados | ${errors} errores | 
            La base de datos ahora está actualizada hasta julio 2026
        `;
    }
